
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123C32">
  <meta name="description" content="Área do Intimador do Sistema AtoNexo.">

  <title>AtoNexo | Área do Intimador</title>

  <!-- Bootstrap 5.3.8 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Supabase JavaScript v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --verde: #123C32;
      --verde-escuro: #0B2B24;
      --verde-medio: #1C5948;
      --fundo: #F3F6F4;
      --texto: #1D3029;
      --texto-suave: #C4D8CE;
      --borda: #DCE5DF;
      --branco: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--fundo);
      color: var(--texto);
      font-family: "Inter", sans-serif;
    }

    /* ========================================
       CABEÇALHO
    ======================================== */

    .topbar {
      background: var(--verde-escuro);
      color: var(--branco);
      padding: 13px 24px;
      box-shadow: 0 2px 10px rgba(11, 43, 36, 0.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      object-fit: contain;
      flex-shrink: 0;
      border-radius: 8px;
      background: var(--branco);
      padding: 3px;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.4px;
      line-height: 1.3;
    }

    .brand-subtitle {
      display: block;
      margin-top: 3px;
      color: var(--texto-suave);
      font-size: 11px;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .header-section {
      color: var(--texto-suave);
      font-size: 12px;
      font-weight: 600;
    }

    .btn-logout {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 39px;
      padding: 8px 15px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 9px;
      background: transparent;
      color: var(--branco);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-logout:hover:not(:disabled) {
      background: rgba(255,255,255,0.12);
      color: var(--branco);
    }

    .btn-logout:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    /* ========================================
       ÁREA PRINCIPAL
       
       Espaço reservado para as funcionalidades
       futuras da página do intimador.
    ======================================== */

    main {
      flex: 1;
      width: 100%;
      padding: 32px 16px;
    }

    .content-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ========================================
       RODAPÉ
    ======================================== */

    footer {
      padding: 20px 16px;
      background: var(--verde-escuro);
      color: var(--texto-suave);
      text-align: center;
      font-size: 11px;
      line-height: 1.8;
    }

    footer strong {
      color: var(--branco);
      font-weight: 700;
    }

    /* ========================================
       RESPONSIVIDADE
    ======================================== */

    @media (max-width: 576px) {
      .topbar {
        padding: 12px 15px;
      }

      .brand {
        gap: 9px;
      }

      .brand-logo {
        width: 43px;
        height: 43px;
      }

      .brand-name {
        font-size: 14px;
      }

      .brand-subtitle {
        font-size: 10px;
      }

      .header-section {
        display: none;
      }

      .header-actions {
        gap: 8px;
      }

      .btn-logout {
        min-height: 36px;
        padding: 7px 10px;
        font-size: 11px;
      }

      main {
        padding: 24px 14px;
      }
    }
  </style>
</head>

<body>

  <!-- ========================================
       CABEÇALHO INSTITUCIONAL
  ======================================== -->

  <header class="topbar">
    <div class="container">
      <div class="d-flex align-items-center justify-content-between gap-3">

        <div class="brand">

          <!-- LOGOTIPO OFICIAL ATONEXO -->
          <img
            src="https://tabpoa.github.io/tabelionatopoa/ato-nexo.png"
            alt="Logotipo AtoNexo"
            class="brand-logo"
          >

          <div>
            <div class="brand-name">Sistema AtoNexo</div>
            <span class="brand-subtitle">
              Gestão de intimações
            </span>
          </div>

        </div>

        <div class="header-actions">

          <span class="header-section">
            <i class="bi bi-person-badge me-1"></i>
            Área do Intimador
          </span>

          <!-- BOTÃO DE SAÍDA COM LOGOUT REAL -->
          <button
            type="button"
            class="btn-logout"
            id="logoutButton"
            title="Sair do sistema"
          >
            <i class="bi bi-box-arrow-right"></i>
            <span id="logoutButtonText">Sair</span>
          </button>

        </div>

      </div>
    </div>
  </header>

  <!-- ========================================
       CONTEÚDO PRINCIPAL

       RESERVADO PARA AS FUNCIONALIDADES
       QUE SERÃO IMPLEMENTADAS NAS PRÓXIMAS ETAPAS.

       Estrutura futura:
       - Identificação do intimador
       - Intimações atribuídas
       - Detalhes das intimações
       - Início da diligência
       - Registro de checkpoints
       - Registro de ocorrências
       - Encerramento da diligência
       - Histórico das atividades
  ======================================== -->

  <main id="areaPrincipal">
    <div class="content-container">

      <!-- FUTURAS IMPLEMENTAÇÕES AQUI -->

    </div>
  </main>

  <!-- ========================================
       RODAPÉ INSTITUCIONAL
  ======================================== -->

  <footer>
    <strong>2º Tabelionato de Protestos de Porto Alegre</strong><br>
    Rua dos Andradas, 1234 • 4º Andar • Centro Histórico • Porto Alegre/RS<br>
    CEP 90020-008 • (51) 3027-3500<br>
    © <span id="currentYear"></span> AtoNexo
  </footer>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    (() => {
      "use strict";

      /* ========================================
         CONFIGURAÇÃO SUPABASE
      ======================================== */

      const SUPABASE_URL =
        "https://dlxqahkjhuocsssosqyj.supabase.co";

      const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_IJ704qHttTZHtI_q8E7CCw_siVAy7Ex";

      /* ========================================
         ELEMENTOS DA PÁGINA
      ======================================== */

      const logoutButton =
        document.getElementById("logoutButton");

      const logoutButtonText =
        document.getElementById("logoutButtonText");

      /* ========================================
         ANO AUTOMÁTICO NO RODAPÉ
      ======================================== */

      document.getElementById("currentYear").textContent =
        new Date().getFullYear();

      /* ========================================
         INICIALIZAÇÃO DO SUPABASE
      ======================================== */

      if (
        !window.supabase ||
        typeof window.supabase.createClient !== "function"
      ) {
        console.error(
          "A biblioteca do Supabase não foi carregada."
        );

        logoutButton.disabled = true;
        logoutButtonText.textContent = "Indisponível";
        return;
      }

      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

      /* ========================================
         SAIR DO SISTEMA

         1. Impede cliques repetidos.
         2. Encerra a sessão no Supabase Auth.
         3. Aguarda a confirmação do logout.
         4. Redireciona para index.html.

         Se houver erro, permanece na página
         e informa o problema.
      ======================================== */

      logoutButton.addEventListener("click", async () => {

        if (logoutButton.disabled) {
          return;
        }

        logoutButton.disabled = true;
        logoutButtonText.textContent = "Saindo...";

        try {

          const { error } = await supabaseClient.auth.signOut({
            scope: "local"
          });

          if (error) {
            throw error;
          }

          // Sessão encerrada: retorna à página inicial.
          window.location.replace("./index.html");

        } catch (error) {

          console.error("Erro ao encerrar a sessão:", error);

          logoutButton.disabled = false;
          logoutButtonText.textContent = "Sair";

          alert(
            "Não foi possível encerrar sua sessão. Tente novamente."
          );
        }
      });

      /* ========================================
         CLIENTE SUPABASE DISPONÍVEL PARA
         AS PRÓXIMAS FUNCIONALIDADES.

         A validação de papel e as operações
         das diligências serão implementadas
         nas próximas etapas.
      ======================================== */

    })();
  </script>

</body>
</html>
